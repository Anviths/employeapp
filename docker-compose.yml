services:
  db:
    image: postgres:16
    container_name: employee-postgres-compose
    environment:
      POSTGRES_DB: employee_db
      POSTGRES_USER: employee_user
      POSTGRES_PASSWORD: local_dev_password

    ports:
      - "5433:5432"
    volumes:
      - employee-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL","pg_isready -U employee_user -d employee_db"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  app:
    build: .
    container_name: employee-app-compose
    ports:
      - "8082:8080"
    mem_limit: 512m
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://db:5432/employee_db
      SPRING_DATASOURCE_USERNAME: employee_user
      SPRING_DATASOURCE_PASSWORD: local_dev_password
      JAVA_TOOL_OPTIONS: "-XX:MaxRAMPercentage=60.0"

    healthcheck:
      test: [ "CMD-SHELL", "curl -fsS http://localhost:8080/actuator/health || exit 1" ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

volumes:
  employee-postgres-data:
    external: true
    name: employee-postgres-data

